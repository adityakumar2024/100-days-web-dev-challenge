<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>

    <div class="slider">
        <img src="https://picsum.photos/id/1015/800/400" class="slide active">
        <img src="https://picsum.photos/id/1016/800/400" class="slide">
        <img src="https://picsum.photos/id/1018/800/400" class="slide">

        <button id="prev">&#10094;</button>
        <button id="next">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
