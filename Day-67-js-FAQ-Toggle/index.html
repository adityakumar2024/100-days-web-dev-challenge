<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="faq-container">
        <h1>Frequently Asked Questions</h1>

        <div class="faq">
            <div class="question">
                <h3>What is HTML?</h3>
                <span>+</span>
            </div>
            <div class="answer">
                <p>HTML is the standard markup language used to create web pages.</p>
            </div>
        </div>

        <div class="faq">
            <div class="question">
                <h3>What is CSS?</h3>
                <span>+</span>
            </div>
            <div class="answer">
                <p>CSS is used to style and design web pages.</p>
            </div>
        </div>

        <div class="faq">
            <div class="question">
                <h3>What is JavaScript?</h3>
                <span>+</span>
            </div>
            <div class="answer">
                <p>JavaScript makes web pages interactive and dynamic.</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
