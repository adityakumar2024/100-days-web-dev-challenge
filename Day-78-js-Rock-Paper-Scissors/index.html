<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🎮 Rock Paper Scissors</h1>

    <div class="score-board">
        <div>
            <h2 id="userScore">0</h2>
            <p>You</p>
        </div>

        <div>
            <h2 id="computerScore">0</h2>
            <p>Computer</p>
        </div>
    </div>

    <div class="choices">
        <button class="choice" data-choice="rock">✊</button>
        <button class="choice" data-choice="paper">✋</button>
        <button class="choice" data-choice="scissors">✌️</button>
    </div>

    <div class="result">
        <p>You Chose: <span id="userChoice">-</span></p>
        <p>Computer Chose: <span id="computerChoice">-</span></p>
        <h2 id="message">Choose Your Move!</h2>
    </div>

    <button id="resetBtn">Reset Game</button>

</div>

<script src="script.js"></script>

</body>
</html>
